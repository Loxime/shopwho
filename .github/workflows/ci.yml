name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopwho_test
          POSTGRES_USER: shopwho
          POSTGRES_PASSWORD: shopwho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopwho -d shopwho_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://shopwho:shopwho@127.0.0.1:5432/shopwho?serverVersion=16&charset=utf8

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql

      - uses: ramsey/composer-install@v3

      - name: Composer validation
        run: composer validate --strict

      - name: PHP syntax
        run: >
          find src public migrations tests
          -name '*.php'
          -print0
          | xargs -0 -n1 php -l

      - name: Database migrations
        run: >
          php bin/console doctrine:migrations:migrate
          --no-interaction
          --env=test

      - name: PHPUnit
        run: vendor/bin/phpunit

  deploy-sandbox:
    name: Deploy sandbox
    needs: quality

    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    concurrency:
      group: shopwho-sandbox
      cancel-in-progress: false

    environment:
      name: sandbox
      url: https://shopwho-sandbox.falchero.fr

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ghcr.io/loxime/shopwho-app:${{ github.sha }}
          cache-from: type=gha,scope=shopwho-app
          cache-to: type=gha,mode=max,scope=shopwho-app

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/nginx/Dockerfile.prod
          push: true
          tags: ghcr.io/loxime/shopwho-web:${{ github.sha }}
          cache-from: type=gha,scope=shopwho-web
          cache-to: type=gha,mode=max,scope=shopwho-web

      - name: Configure SSH
        env:
          SANDBOX_VPS_SSH_KEY: ${{ secrets.SANDBOX_VPS_SSH_KEY }}
          SANDBOX_VPS_KNOWN_HOSTS: ${{ secrets.SANDBOX_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SANDBOX_VPS_SSH_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SANDBOX_VPS_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy sandbox on VPS
        env:
          SANDBOX_VPS_HOST: ${{ secrets.SANDBOX_VPS_HOST }}
          SANDBOX_VPS_USER: ${{ secrets.SANDBOX_VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${SANDBOX_VPS_USER}@${SANDBOX_VPS_HOST}" \
            "SHOPWHO_IMAGE_TAG=${GITHUB_SHA} bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/shopwho-sandbox

          git fetch --prune origin dev
          git checkout -B deploy-sandbox origin/dev

          if grep -q '^SHOPWHO_IMAGE_TAG=' .env.sandbox.local; then
            sed -i \
              "s/^SHOPWHO_IMAGE_TAG=.*/SHOPWHO_IMAGE_TAG=${SHOPWHO_IMAGE_TAG}/" \
              .env.sandbox.local
          else
            printf '\nSHOPWHO_IMAGE_TAG=%s\n' \
              "$SHOPWHO_IMAGE_TAG" \
              >> .env.sandbox.local
          fi

          compose() {
            docker compose \
              --env-file .env.sandbox.local \
              -f compose.sandbox.yaml \
              "$@"
          }

          compose pull app nginx

          compose up -d db

          database_ready=0

          for attempt in $(seq 1 30); do
            if compose exec -T db sh -c \
              'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
              >/dev/null 2>&1; then
              database_ready=1
              break
            fi

            sleep 2
          done

          if [ "$database_ready" -ne 1 ]; then
            echo "PostgreSQL sandbox is not ready."
            compose ps
            exit 1
          fi

          mkdir -p backups

          backup_file="backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"

          compose exec -T db sh -c \
            'pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"' \
            > "$backup_file"

          find backups \
            -type f \
            -name 'pre-deploy-*.dump' \
            -mtime +14 \
            -delete

          compose run \
            --rm \
            --no-deps \
            app \
            php bin/console doctrine:migrations:migrate \
            --no-interaction \
            --env=prod

          compose up \
            -d \
            --remove-orphans \
            app nginx

          http_port="$(
            sed -n 's/^SHOPWHO_HTTP_PORT=//p' \
              .env.sandbox.local \
              | tail -n 1
          )"

          http_port="${http_port:-3033}"

          healthy=0

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              "http://127.0.0.1:${http_port}/healthz" \
              >/dev/null; then
              healthy=1
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Sandbox HTTP healthcheck failed."
            compose ps
            exit 1
          fi

          compose ps

          echo "Sandbox deployed with ${SHOPWHO_IMAGE_TAG}."
          REMOTE
