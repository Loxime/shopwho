name: shopwho-prod

services:
  app:
    image: ghcr.io/loxime/shopwho-app:${SHOPWHO_IMAGE_TAG:?SHOPWHO_IMAGE_TAG is required}
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEFAULT_URI: https://shopwho.falchero.fr
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: ghcr.io/loxime/shopwho-web:${SHOPWHO_IMAGE_TAG:?SHOPWHO_IMAGE_TAG is required}
    ports:
      - "127.0.0.1:${SHOPWHO_HTTP_PORT:-3030}:80"
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
