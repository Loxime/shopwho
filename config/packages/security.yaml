security:
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    shopwho_users:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: shopwho_users
      http_basic:
        realm: 'Shopwho Admin'

  access_control:
    - { path: ^/admin, roles: ROLE_ADMIN }
