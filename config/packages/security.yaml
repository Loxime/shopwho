security:
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    shopwho_users:
      entity:
        class: App\Entity\User
        property: email

  role_hierarchy:
    ROLE_CATALOG_MANAGER:
      - ROLE_BACKOFFICE

    ROLE_MARKETING_MANAGER:
      - ROLE_BACKOFFICE

    ROLE_DATA_ANALYST:
      - ROLE_BACKOFFICE

    ROLE_DATA_MANAGER:
      - ROLE_BACKOFFICE

    ROLE_ADMIN:
      - ROLE_CATALOG_MANAGER
      - ROLE_MARKETING_MANAGER
      - ROLE_DATA_ANALYST
      - ROLE_DATA_MANAGER

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: shopwho_users

      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        default_target_path: app_profile

      logout:
        path: app_logout
        target: app_home

  access_control:
    - { path: ^/inscription$, roles: PUBLIC_ACCESS }
    - { path: ^/connexion$, roles: PUBLIC_ACCESS }
    - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
    - { path: ^/admin/logout$, roles: PUBLIC_ACCESS }
    - { path: ^/profil(?:/|$), roles: ROLE_USER }

    - { path: ^/admin/products(?:/|$), roles: ROLE_CATALOG_MANAGER }
    - { path: ^/admin/categories(?:/|$), roles: ROLE_CATALOG_MANAGER }

    - { path: ^/admin/offers(?:/|$), roles: ROLE_MARKETING_MANAGER }
    - { path: ^/admin/reviews(?:/|$), roles: ROLE_MARKETING_MANAGER }

    - { path: ^/admin/analytics(?:/|$), roles: ROLE_DATA_ANALYST }

    - { path: ^/admin/data-import(?:/|$), roles: ROLE_DATA_MANAGER }
    - { path: ^/admin/data-reset(?:/|$), roles: ROLE_DATA_MANAGER }

    - { path: ^/admin(?:/|$), roles: ROLE_BACKOFFICE }
