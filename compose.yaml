services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["sh", "-lc", "composer install --no-interaction && php-fpm"]
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-shopwho-local-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://shopwho:shopwho@db:5432/shopwho?serverVersion=16&charset=utf8}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopwho
      POSTGRES_USER: shopwho
      POSTGRES_PASSWORD: shopwho
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwho -d shopwho"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  vendor:
